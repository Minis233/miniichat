name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        env:
          RELEASE_STORE_PASSWORD: miniichat
          RELEASE_KEY_ALIAS: miniichat
          RELEASE_KEY_PASSWORD: miniichat

      - name: Upload debug APK (CI artifact only)
        uses: actions/upload-artifact@v4
        with:
          name: miniichat-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APKs (CI artifact)
        uses: actions/upload-artifact@v4
        with:
          name: miniichat-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # GitHub Release: only attach release APKs (v7 + v8 split), no debug.
      - name: Create release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
